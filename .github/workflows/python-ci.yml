name: Python CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install uv
        run: |
          pip install uv
      
      - name: Install all dependencies with uv
        run: |
          uv pip install pytest pytest-cov selenium webdriver-manager
          # Если есть requirements.txt:
          # uv pip install -r requirements.txt
      
      - name: Run tests with coverage
        run: |
          uv run pytest --cov=. --cov-report=xml --cov-report=term || true
      
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=denginsf_qa-auto-engineer-python-project-314
            -Dsonar.organization=denginsf
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=tests/**/*